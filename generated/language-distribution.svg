    .muted    { fill: #8b949e; }
    .line     { stroke: #30363d; }
    .node     { fill: #161b22; stroke: #30363d; }
    .node-txt { fill: #58a6ff; font-weight: 600; }
    .accent   { fill: #58a6ff; }
    .bar-bg   { fill: #21262d; }
    .bar      { fill: url(#darkBlueGradient); }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
</style>
<defs>
