<svg viewBox="0 0 630 252" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository language distribution">
<style>
  .bg       { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; }
  .fg       { fill: #24292f; }
  .muted    { fill: #57606a; }
  .line     { stroke: #d0d7de; }
  .node     { fill: #f6f8fa; stroke: #d0d7de; }
  .node-txt { fill: #0969da; font-weight: 600; }
  .accent   { fill: #0969da; }
  .bar-bg   { fill: #eaeef2; }
  .bar      { fill: url(#blueGradient); }
  @media (prefers-color-scheme: dark) {
    .bg       { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
