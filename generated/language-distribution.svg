<svg viewBox="0 0 600 230" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Repository language distribution">
<style>
  .bg   { fill: #ffffff; }
  .fg   { fill: #1f2328; }
  .muted{ fill: #57606a; }
  .line { stroke: #d0d7de; }
  .node { fill: #f6f8fa; stroke: #d0d7de; }
  .accent { fill: #58A6FF; }
  .bar  { fill: #58A6FF; }
  @media (prefers-color-scheme: dark) {
    .bg   { fill: #0d1117; }
    .fg   { fill: #e6edf3; }
    .muted{ fill: #8b949e; }
    .line { stroke: #30363d; }
    .node { fill: #161b22; stroke: #30363d; }
    .accent { fill: #79c0ff; }
    .bar  { fill: #79c0ff; }
  }
  text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
</style>
<rect class="bg" x="0" y="0" width="600" height="230" rx="10"/>
<text x="16" y="22" class="fg" font-size="13" font-weight="600">Repository Language Distribution</text>
<text x="16" y="54" class="fg" font-size="12">JavaScript</text>
