<svg viewBox="0 0 720 128" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology ecosystem diagram">
<style>
  .bg       { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; }
  .fg       { fill: #24292f; }
  .muted    { fill: #57606a; }
  .line     { stroke: #d0d7de; }
  .node     { fill: #f6f8fa; stroke: #d0d7de; }
  .node-txt { fill: #0969da; font-weight: 600; }
  .accent   { fill: #0969da; }
  .bar-bg   { fill: #eaeef2; }
  @media (prefers-color-scheme: dark) {
    .bg       { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
    .fg       { fill: #f0f6fc; }
    .muted    { fill: #8b949e; }
    .line     { stroke: #30363d; }
    .node     { fill: #161b22; stroke: #30363d; }
    .node-txt { fill: #58a6ff; font-weight: 600; }
    .accent   { fill: #58a6ff; }
    .bar-bg   { fill: #21262d; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
</style>
<rect class="bg" x="1" y="1" width="718" height="126" rx="12"/>
<rect class="node" x="220.0" y="16" width="280" height="32" rx="16" stroke-width="1.5"/>
<text x="360.0" y="37" text-anchor="middle" class="node-txt" font-size="14">Md Al Faiaz Rahman Fahim's Ecosystem</text>
</svg>