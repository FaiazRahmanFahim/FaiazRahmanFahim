name: Update Profile README

on:
  schedule:
    # Runs once per day. Edit `automation.cron` in profile.config.yml
    # to change the schedule, then update this line to match.
    - cron: "17 3 * * *"
  workflow_dispatch: {}
  push:
    paths:
      - "profile.config.yml"
      - "templates/**"
      - "scripts/**"
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-update
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run profile pipeline
        env:
          # The default token is scoped to this repo and is enough to
          # read public data about the same account and to push the
          # commit below. Rate limit: 5,000 requests/hour.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_CACHE: "1"
        run: python scripts/main.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- README.md generated/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md generated/
          git commit -m "chore: automated profile update [skip ci]"
          git push
